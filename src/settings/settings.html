<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GrokBot Assistant — Configurações</title>
  <link rel="stylesheet" href="../ui/tokens.css">
  <link rel="stylesheet" href="settings.css">
  <script src="../lib/accelerator.js" defer></script>
  <script src="settings.js" defer></script>
</head>
<body>
  <header class="app-header">
    <img src="../../assets/icons/icon-256.png" width="40" height="40" alt="">
    <div><h1>GrokBot Assistant</h1><p>Envie prompts para o Grok Bot de qualquer lugar</p></div>
  </header>
  <section id="welcome" aria-labelledby="welcome-title" hidden>
    <h2 id="welcome-title">Bem-vindo!</h2>
    <p id="welcome-message"></p>
  </section>
  <form id="settings-form">
    <main>
      <fieldset id="fields" disabled>
        <section class="section-card" aria-labelledby="destination-title">
          <div class="section-heading"><h2 id="destination-title">Destino</h2><button id="refresh" type="button" class="small">Atualizar lista</button></div>
          <p id="bots-warning" role="status" hidden>Não encontrei seus bots no Grok Bot. Abra o Grok Bot uma vez e clique em Atualizar lista, ou use Outro bot.</p>
          <div id="bots" role="radiogroup" aria-labelledby="destination-title"></div>
          <div id="manual-field" hidden><label for="bot">Link ou ID do bot</label><input id="bot" type="text" placeholder="Cole o link ou ID do bot"></div>
        </section>
        <section class="section-card" aria-labelledby="shortcut-title">
          <h2 id="shortcut-title">Atalho</h2>
          <div class="shortcut-row"><div id="shortcut" aria-label="Atalho global" aria-live="polite"></div><div class="shortcut-actions"><button id="record" type="button">Alterar</button><button id="restore" class="small quiet" type="button">Restaurar padrão</button></div></div>
        </section>
        <section class="section-card" aria-labelledby="general-title">
          <h2 id="general-title">Geral</h2>
          <label class="switch-row" for="launch-at-login"><span>Iniciar com o Windows<small>Abre o GrokBot Assistant ao entrar no Windows</small></span><input id="launch-at-login" type="checkbox" role="switch"></label>
          <div class="after-send" role="group" aria-labelledby="after-send-title">
            <p id="after-send-title">Depois de enviar</p>
            <div class="segmented">
              <label><input type="radio" name="after-send" value="wait" checked aria-describedby="after-send-help"><span>Esperar a resposta</span></label>
              <label><input type="radio" name="after-send" value="hide" aria-describedby="after-send-help"><span>Fechar e avisar</span></label>
            </div>
            <p id="after-send-help"></p>
          </div>
        </section>
      </fieldset>
    </main>
    <footer><button id="close" type="button">Fechar</button><button id="save" type="submit" disabled>Salvar</button></footer>
  </form>
  <p id="status" role="status" aria-live="polite" hidden></p>
</body>
</html>
