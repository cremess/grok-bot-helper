<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="app.name">Grok Bot Helper</title>
  <link rel="stylesheet" href="../ui/tokens.css">
  <link rel="stylesheet" href="../ui/bot-picker.css">
  <link rel="stylesheet" href="prompt.css">
  <script src="../lib/i18n.js" defer></script>
  <script src="../lib/markdown.js" defer></script>
  <script src="../lib/relative-time.js" defer></script>
  <script src="../lib/templates.js" defer></script>
  <script src="../ui/bot-picker.js" defer></script>
  <script src="prompt.js" defer></script>
</head>
<body>
  <main id="card">
    <header>
      <span class="drag-handle" aria-hidden="true"></span>
      <div id="destination-picker"></div>
      <div class="header-actions">
      <button id="templates" class="icon-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="template-menu" data-i18n-aria-label="prompt.templates" aria-label="Templates" data-i18n-title="prompt.templatesHelp" title="Templates (Ctrl+T)" hidden>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><path d="M3 2h7l3 3v9H3ZM6 7h4M6 10h4"/></svg>
      </button>
      <button id="pin" class="icon-button" type="button" data-i18n-aria-label="prompt.pin" aria-label="Pin" aria-pressed="false" data-i18n-title="prompt.pinHelp" title="Pin (keep open when clicking outside)">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><path d="m10 2 4 4-2 1-3 3v3l-3-3-4 4 4-4-3-3h3l3-3Z"/></svg>
      </button>
      <button id="close" class="icon-button" type="button" data-i18n-aria-label="prompt.close" aria-label="Close" data-i18n-title="prompt.closeHelp" title="Close (Esc)"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg></button>
      <button id="settings" class="icon-button" type="button" data-i18n-aria-label="prompt.settings" aria-label="Open settings" data-i18n-title="prompt.settingsHelp" title="Settings (Ctrl+,)">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><path d="m6 2-.5 2-1 .6-2-.3L1.5 7l1.3 1v1l-1.3 1L3 13l1.5-.5 1 .5.5 1h4l.5-1 1-.5 1.5.5 1.5-3-1.3-1V8L14.5 7 13 4.3l-2 .3-1-.6-.5-2Z"/><circle cx="8" cy="8" r="2"/></svg>
      </button>
      </div>
    </header>
    <div id="content">
    <div id="usage-warning" role="status" hidden></div>
    <section id="response" data-i18n-aria-label="prompt.response" aria-label="Bot reply" hidden>
      <div class="response-heading">
        <span id="response-avatar" class="avatar" aria-hidden="true">G</span>
        <strong id="response-name"></strong><span id="response-time"></span>
        <button id="copy-response" class="icon-button" type="button" data-i18n-aria-label="prompt.copy" aria-label="Copy reply" data-i18n-title="prompt.copy" title="Copy reply">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><g id="copy-icon"><rect x="6" y="6" width="7" height="8" rx="1.5"/><path d="M10 6V2H2v9h4"/></g><path id="copy-check" d="m3 8 3 3 7-7" hidden/></svg>
        </button>
        <button id="open-bot" class="icon-button" type="button" data-i18n-aria-label="prompt.openConversation" aria-label="Open conversation in Grok Bot" data-i18n-title="prompt.openConversation" title="Open conversation in Grok Bot">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><path d="M9 2h5v5m0-5L7 9m0-6H2v11h11V9"/></svg>
        </button>
        <button id="conversation-toggle" class="text-button" type="button" aria-pressed="false" data-i18n="prompt.conversation">Conversation</button>
      </div>
      <div id="response-body" class="collapsed"></div>
      <button id="expand-response" class="text-button" type="button" aria-expanded="false" data-i18n="prompt.more">Show more</button>
    </section>
    <div id="empty-state" role="status" hidden><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><path d="M2 3h12v8H6l-4 3Z"/></svg><p id="empty-message"></p></div>
    <section id="waiting-area" aria-live="polite" hidden></section>
    </div>
    <div id="template-menu" role="menu" data-i18n-aria-label="prompt.templates" aria-label="Templates" hidden></div>
    <div class="composer">
    <textarea id="message" rows="1" data-i18n-aria-label="prompt.message" aria-label="Message to Grok Bot" data-i18n-placeholder="prompt.placeholder" placeholder="Ask or tell Grok anything…"></textarea>
      <button id="send" type="button" disabled data-i18n-aria-label="prompt.send" aria-label="Send" data-i18n-title="prompt.send" title="Send"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><path d="M8 12V4m-4 4 4-4 4 4"/></svg></button>
    </div>
    <div id="error" role="alert" hidden></div>
    <div id="notice" role="status" hidden></div>
    <footer>
      <span class="hints"><kbd>Enter</kbd> <span data-i18n="prompt.hints.send">send</span> · <kbd>Shift+Enter</kbd> <span data-i18n="prompt.hints.newLine">new line</span> · <kbd>Esc</kbd> <span data-i18n="prompt.hints.close">close</span></span>
      <span id="counter" aria-live="polite" hidden>0/1000</span>
      <span id="usage-indicator" hidden></span>
    </footer>
  </main>
</body>
</html>
